tools:
- name: search_studies
  description: Search clinical study records by term, condition, location, intervention, title, status or geography.
  backing_operation: GET /studies
  parameters: [format, query.term, query.cond, query.locn, query.titles, query.intr, filter.overallStatus, filter.geo, fields, pageSize, pageToken, countTotal]
- name: get_study
  description: Retrieve a single study record by its NCT identifier.
  backing_operation: GET /studies/{nctId}
  parameters: [nctId, format, fields]
- name: get_study_field_metadata
  description: List every study data field, its type and its position in the study data structure.
  backing_operation: GET /studies/metadata
  parameters: [includeIndexedOnly, includeHistoricOnly]
- name: list_search_areas
  description: List the named search areas that query.* parameters accept.
  backing_operation: GET /studies/search-areas
  parameters: []
- name: list_enums
  description: List the controlled-vocabulary enumerations used across study fields.
  backing_operation: GET /studies/enums
  parameters: []
- name: get_study_sizes
  description: Distribution of study record sizes in the registry.
  backing_operation: GET /stats/size
  parameters: []
- name: get_field_values
  description: Value distribution statistics for named study fields.
  backing_operation: GET /stats/field/values
  parameters: [types, fields]
- name: get_field_sizes
  description: Size statistics for named study fields.
  backing_operation: GET /stats/field/sizes
