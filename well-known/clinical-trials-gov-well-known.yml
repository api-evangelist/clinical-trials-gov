source: live HTTPS probes of every host in apis.yml + OpenAPI servers[]
note: >-
  Recorded absence. clinicaltrials.gov is an Angular single-page app behind nginx: every
  /.well-known/* path that the SPA router does not recognise is answered by the app catch-all
  with HTTP 200 and the 94,295-byte HTML shell (identical bytes to the home page), while paths
  nginx handles directly return a real 404. NONE of the 200s carries a document, so no
  WellKnown or SecurityTxt pointer is emitted. aact.ctti-clinicaltrials.org (the CTTI mirror)
  returns honest 404s on every path. No OAuth surface exists because the API is unauthenticated.
