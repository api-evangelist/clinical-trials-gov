  registry.npmjs.org, pypi.org, github.com and the ClinicalTrials.gov developer pages
  (https://clinicaltrials.gov/data-api, https://clinicaltrials.gov/data-api/api)
summary:
  official_count: 0
  third_party_count: 4
  finding: >-
    The National Library of Medicine publishes NO first-party client library for the
    ClinicalTrials.gov Data API v2 in any package registry, and the developer pages link
    to none. The GitHub account the catalog previously pointed at
    (https://github.com/clinicaltrialsgov) returns HTTP 404 — no NLM-owned source
    repository for this API exists on GitHub. Every package below is community-built
    against the public v2 REST API; none is endorsed by NLM/NIH. Recorded so the absence
    of an official SDK is a measured fact rather than an unchecked gap.
official_sdks: []
