# Naftiko capabilities profile for ClinicalTrials.gov.
# Capabilities map verbs against the high-value operations exposed
# by the Data API v2 at https://clinicaltrials.gov/api/v2.
provider: clinical-trials-gov
name: ClinicalTrials.gov
description: >-
  ClinicalTrials.gov is the U.S. NIH registry and results database of
  clinical studies. These capabilities cover searching the registry,
  retrieving studies by NCT ID, exploring metadata and search areas,
  and reading version and statistics endpoints.
capabilities:
  - id: clinical-trials-gov.studies.search
    name: Search studies
    description: >-
      Search the registry by free-text query, condition, intervention,
      location, and structured filters with paging and selectable fields.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1studies/get
    inputs:
      - query.term
      - query.cond
      - query.intr
      - query.locn
      - filter.overallStatus
      - filter.geo
      - pageSize
      - pageToken
      - fields
      - format
    outputs:
      - studies
      - nextPageToken
      - totalCount

  - id: clinical-trials-gov.studies.get
    name: Get a single study
    description: Retrieve a single study record by its NCT identifier.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1studies~1{nctId}/get
    inputs:
      - nctId
      - fields
      - format
    outputs:
      - study

  - id: clinical-trials-gov.studies.metadata
    name: Get study fields metadata
    description: >-
      Return field-level metadata describing the study record schema,
      types, and allowed values used by /studies queries.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1studies~1metadata/get
    inputs:
      - includeIndexedOnly
    outputs:
      - fields

  - id: clinical-trials-gov.studies.search-areas
    name: List search areas
    description: List the named search areas usable in /studies queries.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1studies~1search-areas/get
    inputs: []
    outputs:
      - searchAreas

  - id: clinical-trials-gov.studies.enums
    name: List enumerations
    description: List enumerated values used for filter and field parameters.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1studies~1enums/get
    inputs: []
    outputs:
      - enums

  - id: clinical-trials-gov.version.get
    name: Get API version
    description: Return the data version and last-updated timestamp.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1version/get
    inputs: []
    outputs:
      - apiVersion
      - dataTimestamp

  - id: clinical-trials-gov.stats.size
    name: Get study size statistics
    description: Return aggregate counts and size statistics for the registry.
    api: clinical-trials-gov:data-api-v2
    operationRef: openapi/clinical-trials-gov-data-api-v2-openapi.yml#/paths/~1stats~1size/get
    inputs: []
    outputs:
      - totalStudies
      - sizes
