- aid: clinical-trials-gov:classic-api
  name: ClinicalTrials.gov Classic API
  tags:
  - Clinical Trials
  - Legacy
  - REST
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://clinicaltrials.gov/api
  humanURL: https://clinicaltrials.gov/data-api/api
  properties:
  - url: https://clinicaltrials.gov/data-api/api
    type: Documentation
  description: >-
    The Classic API is the legacy ClinicalTrials.gov interface that preceded the Data API v2 and exposes
    full-study, brief-study, and field-values endpoints with XML, JSON, and CSV responses. It is being
    deprecated in favor of the v2 REST API and remains online for backward compatibility while consumers
    migrate.
- aid: clinical-trials-gov:bulk-downloads
  name: ClinicalTrials.gov Bulk Downloads
  tags:
  - Bulk
  - Datasets
  - Open Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clinicaltrials.gov/data-api/about-api/csv-download
  properties:
  - url: https://clinicaltrials.gov/data-api/about-api/csv-download
    type: Documentation
  description: >-
    ClinicalTrials.gov provides bulk CSV and JSON downloads of the full study registry through the data-api
    download endpoints. These artifacts support large-scale analytics, archival, and offline mirrors of
    the registry without making per-record API calls.
- aid: clinical-trials-gov:aact
  name: AACT Database
  tags:
  - Analytics
  - Database
  - Postgres
  - Research
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://aact.ctti-clinicaltrials.org/
  properties:
  - url: https://aact.ctti-clinicaltrials.org/
    type: Documentation
  - url: https://aact.ctti-clinicaltrials.org/data_dictionary
    type: Data Dictionary
  description: >-
    AACT (Aggregate Analysis of ClinicalTrials.gov) is a publicly available relational database of all
    ClinicalTrials.gov study content maintained by the Clinical Trials Transformation Initiative (CTTI)
    at Duke University. It is updated daily and is widely used by researchers as a SQL-friendly mirror
    of the registry.
